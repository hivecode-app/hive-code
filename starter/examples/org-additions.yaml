# What to add to company/org.yaml in the setup conversation. Every list here merges into the list of the same name there.
# The id of a project team = the id of the project. The id of an identity: lowercase English letters, by the name (avivit, hadar).

monitoring_lead: hadar     # only if there is at least one production

projects:
  - id: example-app
    name: The app            # the display name on the board, in the owner's words
    status: active
    team: example-app
  - id: old-site
    name: The old site
    status: dormant          # dormant: no team. The charter exists, with status: dormant

teams:
  - id: example-app
    name: The app
    kind: project
    project: example-app
    symbol: smartphone
    lead: aviv
    members: []
    helpers: ephemeral

  - id: monitoring
    name: Monitoring team
    kind: permanent
    symbol: monitor_heart
    lead: hadar
    members: []
    helpers: ephemeral

identities:
  - id: aviv
    name: Aviv
    gender: male
    title: App team lead
    symbol: smartphone
    monogram: אב
    team: example-app
    reports_to: manager
    kind: project
    lifecycle: always-on
    home: srv1              # one of machines
    may_open: [task]
    memory_domain: projects/example-app
    grants: []
    automations: []

  - id: hadar
    name: Hadar
    gender: female
    title: Monitoring team lead
    symbol: shield
    monogram: הד
    team: monitoring
    reports_to: manager
    kind: permanent
    lifecycle: always-on
    home: srv1
    may_open: [task]
    memory_domain: company
    grants: []              # monitoring only watches and reports, until the owner gives a permission explicitly
    automations:
      - id: prod-probes
        what: probe-runner runs the production checks from the charters (GET only, no tokens). An anomaly wakes the monitoring lead
        when: by the every of each probe in the project charter
        enabled: true
