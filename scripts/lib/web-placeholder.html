<p>הגרסה הזו של המנוע הותקנה מהקוד, בלי האפליקציה ל-web. נכנסים מהאפליקציה לאנדרואיד: סורקים את ה-QR מההתקנה, או מדביקים את הקישור במסך הכניסה. גרסה משוחררת (<code>company update</code>) כוללת את האפליקציה ל-web.</p>
