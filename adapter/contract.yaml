  # ---- B.6 extensions

  - id: replay_echo
    internal: "--replay-user-messages echo (isReplay:true, same uuid)"
    use: delivery state `started` (B.4)
    stability: medium
    canary: "send user with uuid -> echo with the same uuid and isReplay:true"
    check: [replay_echo]
    fast: true
    disables: started-state (lifecycle remains)
    evidence: "probe 2.1.303 + bet 2: echo arrives when the message is DEQUEUED (p95 25.6s over 100 msgs), not on receipt. It is the `started` signal only"

  - id: command_lifecycle
    internal: "command_lifecycle {command_uuid, state: queued|started|completed} (capability msg_lifecycle_v1)"
    use: delivery state `delivered` = queued (on receipt, any priority); `completed` = its turn ended
    stability: low
    canary: "send user with uuid -> lifecycle queued then started then completed for that command_uuid"
    check: [command_lifecycle]
    fast: true
    disables: delivered-state falls back to replay echo
    evidence: "probe 2.1.303; bet 2: queued p95 0.11s over 100 messages (max 1.19s), delivered = queued"

  - id: queue_reinject_on_resume
    internal: "CLI persists its input queue (queue-operation enqueue/dequeue with content) and re-injects unconsumed items on --resume as ONE user line with a NEW uuid"
    use: no lost and no duplicated messages after a crash (shift-host keeps them delivered/heldByCli and matches the echo by content)
    stability: low
    canary: "kill -9 with 2 queued messages; --resume -> both answered exactly once; transcript enqueue content matches"
    check: "-"
    fast: false
    disables: crash dedup (falls back to fail + hq resend -> possible duplicate)
    evidence: "bet 2 run 1/2 (w4 on ci-host: 2 queued messages answered after resume)"

