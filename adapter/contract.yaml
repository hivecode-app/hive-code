# Claude Code internals the company depends on (B.6), one row per internal.
# Source: research/05 §8 (adopted as is) + B.6 extensions + findings on 2.1.303.
#
# Fields
#   id          stable key; scripts/canary.mjs reports by it
#   internal    what we touch
#   use         what breaks for us if it changes
#   stability   high | medium | low (research/05 §5)
#   canary      how a break is detected
#   check       canary.mjs check id(s); "-" = not automated yet
#   fast        true = part of the ~30s haiku subset (hq startup); else nightly/candidate only
#   disables    capability that is turned off when this row fails (B.6: fail only the dependent capability)
#   evidence    where it was last observed
#
# Run: node scripts/canary.mjs [--bin <claude>] [--model haiku] [--json]
# Pinned binary: ~/.local/share/agent-company/claude/<ver>/claude (current -> 2.1.303).

version: 1
pinned: "2.1.303"
verified_on: ["2.1.303"]

rows:
  - id: stream_json
    internal: "-p --input-format/--output-format stream-json (stdin user, result, system/init)"
    use: control channel of every shift
    stability: high
    canary: 'send "Reply OK"; expect system/init.session_id == --session-id and result.subtype=="success"'
    check: [init_session_id, result_success]
    fast: true
    disables: shifts
    evidence: research/05 exp.1-4; probe 2.1.303

  - id: midturn_user
    internal: "user line on stdin mid-turn (priority now|next|later)"
    use: add an instruction to a working worker
    stability: high
    canary: "exp.2 shortened: 8s tool, message at t=3, both tokens in the same result, num_turns>=2"
    check: "-"
    fast: false
    disables: priority delivery
    evidence: research/05 exp.2

  - id: interrupt
    internal: "control_request interrupt"
    use: stop a worker without killing the process
    stability: high
    canary: 'interrupt during Bash sleep -> control_response success, result.subtype=="error_during_execution" within 2s'
    check: [interrupt]
    fast: true
    disables: stop button
    evidence: research/05 exp.2

  - id: get_usage
    internal: "control_request get_usage"
    use: per-account quota before dispatch (B.7)
    stability: medium
    canary: "rate_limits.five_hour.utilization and seven_day.utilization numeric (percent)"
    check: [get_usage]
    fast: true
    disables: account placement by quota
    evidence: research/05 exp.2; probe 2.1.303 (codename keys still present - read only five_hour/seven_day/limits[])

  - id: rate_limit_event
    internal: "rate_limit_event.rate_limit_info.unifiedWindows"
    use: continuous quota from every stream
    stability: medium
    canary: "at least one event per stream with five_hour.utilization in 0..1"
    check: [rate_limit_event]
    fast: true
    disables: live quota display
    evidence: probe 2.1.303

  - id: get_context_usage
    internal: "control_request get_context_usage"
    use: proactive rotation threshold (B.2)
    stability: medium
    canary: "totalTokens>0, maxTokens>0"
    check: [get_context_usage]
    fast: true
    disables: proactive rotation (auto-compact remains the net)
    evidence: probe 2.1.303 (maxTokens 1000000 on haiku-5-5)

  - id: statusline_json
    internal: "statusline stdin JSON (rate_limits, context_window)"
    use: HUD for the owner's personal sessions (B.8)
    stability: high
    canary: "statusline relay logs and alerts if rate_limits missing after first response on Max"
    check: "-"
    fast: false
    disables: personal-session board rows
    evidence: research/05 §2.4

  - id: session_start_context
    internal: "SessionStart command hook -> hookSpecificOutput.additionalContext (source startup|resume|compact|fork)"
    use: inject L2 handoff + L1 delta (company hook SessionStart reads prime.json)
    stability: high
    canary: "company hook SessionStart with a codeword in prime.json; the model quotes it; after /compact source==compact quotes the fresh value"
    check: [session_start_context]
    fast: true
    disables: handoff injection (shift starts cold)
    evidence: research/05 exp.1

  - id: pre_post_compact
    internal: "PreCompact / PostCompact (compact_summary)"
    use: shift journal around compaction
    stability: high
    canary: "/compact -> PostCompact spool line has non-empty compact_summary"
    check: "-"
    fast: false
    disables: compact journal
    evidence: research/05 exp.1

  - id: async_rewake
    internal: "asyncRewake hooks"
    use: wake an idle worker on an external event
    stability: medium
    canary: "hook exits 2 after 5s -> new turn on an idle session"
    check: "-"
    fast: false
    disables: event wake (stdin wake remains)
    evidence: research/05 §2.2

  - id: session_id_resume_fork
    internal: "--session-id, --resume, --fork-session"
    use: deterministic shift id, continue a shift, seance
    stability: medium
    canary: "resume answers a fact from a prior turn; fork gives a new id and a file whose sessionId fields are all new; summary kept after compact"
    check: "-"
    fast: false
    disables: resume (new shift + handoff instead)
    evidence: research/05 exp.3

  - id: session_id_collision
    internal: '--session-id <uuid> of an existing transcript -> "Session ID ... is already in use", exit != 0'
    use: deterministic ids must never silently reuse a shift (B.2); adapter classifies stderr as session_id_in_use
    stability: medium
    canary: "second -p with the canary's session id fails with 'already in use' and a non-zero exit"
    check: [session_id_collision]
    fast: true
    disables: none (shift numbers come from the store; a hit is a store bug)
    evidence: "bet 1: a reused shift number collided and the shift 'ran' doing nothing"

  - id: prompt_after_dashdash
    internal: "positional prompt after `--` (variadic --tools/--add-dir/--disallowedTools swallow it otherwise)"
    use: fork / seance / one-shot -p calls
    stability: high
    canary: "covered by session_id_collision call (prompt after --); a turn without `result` is a failure"
    check: [session_id_collision]
    fast: true
    disables: seance
    evidence: "bet 1: --tools swallowed the prompt; the session ended right after the hook, only stderr showed it"

  - id: system_prompt_snapshot
    internal: "--system-prompt-snapshot"
    use: know whether a role change reaches a resumed shift
