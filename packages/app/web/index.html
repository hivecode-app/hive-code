<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="החברה">
  <meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>החברה</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The screen comes up before the app (APP-SPEC §7.5): a quiet spinner with a word, removed on first frame. */
    html, body { margin: 0; height: 100%; background: #F5F5F3; color: #5E6167; font-family: system-ui, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) { html, body { background: #121314; color: #A0A3A9; } }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; }
    #boot i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
  </style>
</head>
<body>
  <div id="boot"><i></i><span>טוען</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () { var b = document.getElementById('boot'); if (b) b.remove(); });
  </script>
  <script src="passkey.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
