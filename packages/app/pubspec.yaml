name: agent_company
description: "החברה: the company app for Android and desktop web (docs/app/APP-SPEC.md)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  intl: ^0.20.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_symbols_icons: ^4.2960.0
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  record: ^7.1.2
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  file_picker: ^13.3.2
  pdfrx: ^2.11.0
  share_plus: ^13.3.1
  video_player: ^2.14.1
  web: ^1.1.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
dev_dependencies:
  image_picker_platform_interface: ^2.11.2
  analyzer: ^10.1.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

  material_color_utilities: ^0.13.0
flutter:
  generate: true
  uses-material-design: true

  # Heebo (UI) and JetBrains Mono (code), static instances cut from the variable fonts
  # (APP-SPEC §7.3: weights 400, 500, 700). Licenses: OFL, see assets/fonts/OFL.txt.
  fonts:
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-400.ttf
          weight: 400
        - asset: assets/fonts/Heebo-500.ttf
          weight: 500
        - asset: assets/fonts/Heebo-600.ttf
          weight: 600
        - asset: assets/fonts/Heebo-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
