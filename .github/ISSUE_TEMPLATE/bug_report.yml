name: Bug report
description: Something in Hive Code does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. For a security problem, do not open an issue: use **Report a vulnerability** on the Security tab ([SECURITY.md](../blob/main/SECURITY.md)).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `readlink ~/.local/share/agent-company/engine/current`, or the `engine/current:` line of the report `company doctor` writes.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The app on Android
        - The app on iPhone
        - The app in a browser
        - The server (hq, workers, install or update)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: company doctor
      description: Run `company doctor` and attach the file it writes. It removes tokens and keys, but read it before you attach it.
