# company-ci: the check every pull request must pass before it merges.
# GitHub-hosted runners only. A public repository must not run pull requests from forks on a self-hosted runner.
name: company-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: company-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  company-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: media and artifact test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 ffmpeg poppler-utils libreoffice-writer libreoffice-calc caddy clang
      - run: npm ci --no-audit --no-fund
      - name: contract
        run: npm run check:contract && npm run test:contract && npm run test:deploy
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      # The app: flutter analyze and test, only when the pull request (or the push) touches it.
      - name: app changed?
        id: app
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git diff --quiet "$BASE" HEAD -- packages/app packages/shared/src/ui-terms.json .github/workflows/company-ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.app.outputs.run == 'true'
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: flutter analyze
        if: steps.app.outputs.run == 'true'
        working-directory: packages/app
        run: |
          flutter pub get
          flutter analyze
      - name: flutter test
        if: steps.app.outputs.run == 'true'
        working-directory: packages/app
        # The layout fixtures are a day at +07 and build their times with local DateTime.
        env:
          TZ: Asia/Bangkok
        run: flutter test
