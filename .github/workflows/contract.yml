name: contract

on:
  pull_request:
    paths: ['company/**', 'memory/**', 'scripts/check-contract*.mjs', '.github/workflows/contract.yml']
  push:
    branches: [main]
    paths: ['company/**', 'memory/**', 'scripts/check-contract*.mjs', '.github/workflows/contract.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-contract.mjs
      - run: node --test scripts/check-contract.test.mjs
